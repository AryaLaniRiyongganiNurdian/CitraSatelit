name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/aryalaniriyongganinurdian/citrasatelit:latest
          labels: org.opencontainers.image.source=https://github.com/AryaLaniRiyongganiNurdian/CitraSatelit
          build-args: |
            VITE_COLAB_NOTEBOOK_URL=https://colab.research.google.com/github/AryaLaniRiyongganiNurdian/CitraSatelit/blob/main/notebooks/citrasatelit.ipynb
            SPACE_ASSETS_URL=https://github.com/AryaLaniRiyongganiNurdian/CitraSatelit/releases/download/v1.0/space_assets_v1.tar.gz
